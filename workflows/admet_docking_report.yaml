schema: caddsuite.workflow/1
name: ADMET, docking and report
description: Configurable example; QED threshold is illustrative. Supply a compatible prepared receptor/site and configure installed Vina/Meeko executable paths before execution.
inputs:
  compounds:
    contract: compound/1.0
  target_structure:
    contract: structure/1.0
  prepared_receptor:
    contract: prepared_receptor/1.0
  binding_site:
    contract: binding_site/1.0
stages:
  - id: admet
    kind: property_prediction
    engine: rdkit_rules
    for_each: compound
    input_contracts:
      compound: compound/1.0
    input_bindings:
      compound: $compounds
    output_contract: property_prediction_set/1.0
    params:
      endpoints: [drug_likeness, structural_alerts, physicochemistry]
  - id: protonate
    kind: chemistry.protonate
    engine: dimorphite_dl
    for_each: compound
    input_contracts:
      compound: compound/1.0
    input_bindings:
      compound: $compounds
    output_contract: compound_form/1.0
    params:
      target_ph: 7.4
      ambiguous_microstates: require_decision
  - id: configured_filter
    kind: gate
    for_each: compound
    needs: [admet, protonate]
    input_contracts:
      predictions: property_prediction_set/1.0
      ligand: compound_form/1.0
    input_bindings:
      predictions: admet
      ligand: protonate
    output_contract: compound_form/1.0
    gate: admet.qed >= 0.4
    on_fail: exclude
    params:
      field_bindings:
        admet.qed: predictions.qed
  - id: embed
    kind: chemistry.embed
    engine: rdkit_etkdg
    for_each: compound
    needs: [configured_filter]
    input_contracts:
      form: compound_form/1.0
    input_bindings:
      form: configured_filter
    output_contract: conformer/1.1
    params:
      policy:
        seed: 42
        optimizer: MMFF94
  - id: dock
    kind: docking
    engine: vina
    for_each: compound
    needs: [configured_filter, embed]
    input_contracts:
      compound: compound/1.0
      form: compound_form/1.0
      conformer: conformer/1.1
      receptor: prepared_receptor/1.0
      target_structure: structure/1.0
      site: binding_site/1.0
    input_bindings:
      compound: $compounds
      form: configured_filter
      conformer: embed
      receptor: $prepared_receptor
      target_structure: $target_structure
      site: $binding_site
    output_contract: docking_result/1.0
    params:
      exhaustiveness: 16
      num_modes: 9
      seed: 42
  - id: report
    kind: report
    needs: [admet, dock]
    input_contracts:
      property_results: property_prediction_set/1.0
      compounds: compound/1.0
      docking_results: docking_result/1.0
    input_bindings:
      compounds: $compounds
      property_results: admet
      docking_results: dock
    output_contract: report_bundle/1.0
    params:
      formats: [html, json, csv]
outputs:
  report: report
