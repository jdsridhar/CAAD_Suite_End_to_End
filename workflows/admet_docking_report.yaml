schema: caddsuite.workflow/1
name: ADMET, docking and report
description: >-
  Configurable reference workflow. Chain A and pH 7.4 below are explicit example choices;
  inspect the target and change both chain selections and pH before using a different target.
  The binding site is a blind whole-protein box, not a predicted pocket. Replace the placeholder
  executable paths with installed, licensed tools before execution.
inputs:
  compounds:
    contract: compound/1.0
  target_structure:
    contract: structure/1.0
stages:
  - id: admet
    kind: property_prediction
    engine: rdkit_rules
    for_each: compound
    input_contracts:
      compound: compound/1.0
    input_bindings:
      compound: $compounds
    output_contract: property_prediction_set/1.0
    params:
      endpoints: [drug_likeness, structural_alerts, physicochemistry]
  - id: protonate
    kind: chemistry.protonate
    engine: dimorphite_dl
    for_each: compound
    input_contracts:
      compound: compound/1.0
    input_bindings:
      compound: $compounds
    output_contract: compound_form/1.0
    params:
      target_ph: 7.4
      ambiguous_microstates: require_decision
  - id: configured_filter
    kind: gate
    for_each: compound
    needs: [admet, protonate]
    input_contracts:
      predictions: property_prediction_set/1.0
      ligand: compound_form/1.0
    input_bindings:
      predictions: admet
      ligand: protonate
    output_contract: compound_form/1.0
    gate: admet.qed >= 0.4
    on_fail: exclude
    params:
      field_bindings:
        admet.qed: predictions.qed
  - id: embed
    kind: chemistry.embed
    engine: rdkit_etkdg
    for_each: compound
    needs: [configured_filter]
    input_contracts:
      form: compound_form/1.0
    input_bindings:
      form: configured_filter
    output_contract: conformer/1.1
    params:
      policy:
        seed: 42
        optimizer: MMFF94
  - id: prepare_protein
    kind: structure.prepare_protein
    engine: pdbfixer
    for_each: target
    input_contracts:
      structure: structure/1.0
    input_bindings:
      structure: $target_structure
    output_contract: prepared_receptor/1.0
    params:
      selected_chain_ids: [A]
      ph: 7.4
      engine_parameters:
        python_executable: /absolute/path/to/pdbfixer/bin/python
        worker_script: /absolute/path/to/caddsuite/src/caddsuite_worker/pdbfixer_worker.py
  - id: binding_site
    kind: structure.binding_site
    engine: blind_protein_box
    for_each: target
    needs: [prepare_protein]
    input_contracts:
      structure: structure/1.0
      receptor: prepared_receptor/1.0
    input_bindings:
      structure: $target_structure
      receptor: prepare_protein
    output_contract: binding_site/1.0
    params:
      selected_chain_ids: [A]
  - id: dock
    kind: docking
    engine: vina
    for_each: compound
    needs: [configured_filter, embed, prepare_protein, binding_site]
    input_contracts:
      compound: compound/1.0
      form: compound_form/1.0
      conformer: conformer/1.1
      receptor: prepared_receptor/1.0
      target_structure: structure/1.0
      site: binding_site/1.0
    input_bindings:
      compound: $compounds
      form: configured_filter
      conformer: embed
      receptor: prepare_protein
      target_structure: $target_structure
      site: binding_site
    output_contract: docking_result/1.0
    params:
      engine_parameters:
        vina_executable: /absolute/path/to/vina
        meeko_python: /absolute/path/to/meeko/bin/python
        mk_prepare_receptor: /absolute/path/to/mk_prepare_receptor.py
        mk_prepare_ligand: /absolute/path/to/mk_prepare_ligand.py
        mk_export: /absolute/path/to/mk_export.py
      docking_parameters:
        exhaustiveness: 16
        num_modes: 9
        energy_range_kcal_mol: 3.0
        cpu_cores: 2
        seed: 42
  - id: report
    kind: report
    needs: [admet, dock]
    input_contracts:
      property_results: property_prediction_set/1.0
      compounds: compound/1.0
      docking_results: docking_result/1.0
    input_bindings:
      compounds: $compounds
      property_results: admet
      docking_results: dock
    output_contract: report_bundle/1.0
    params:
      formats: [html, json, csv]
outputs:
  report: report
