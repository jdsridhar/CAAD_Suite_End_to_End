name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environments/caddsuite.yml
          cache-environment: true
          init-shell: bash
      - name: Install package and dev dependencies
        shell: bash -el {0}
        run: python -m pip install --no-build-isolation -e ".[dev,chem,protonation,structure,analysis,visualization,reporting,volumetric]"
      - name: Static and repository checks
        shell: bash -el {0}
        run: bash scripts/check.sh
      - name: Core coverage target
        shell: bash -el {0}
        run: |
          pytest -q --cov=caddsuite --cov=caddsuite_worker \
            --cov-report=json:/tmp/caddsuite-coverage.json
          python scripts/summarize_coverage.py /tmp/caddsuite-coverage.json \
            --minimum-core 85

