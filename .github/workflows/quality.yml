name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environments/caddsuite.yml
          cache-environment: true
          init-shell: bash
      - name: Install headless rendering support
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Install package and dev dependencies
        shell: bash -el {0}
        run: python -m pip install --no-build-isolation -e ".[dev,chem,protonation,structure,analysis,visualization,reporting,volumetric]"
      - name: Static and repository checks
        shell: bash -el {0}
        run: xvfb-run -a bash scripts/check.sh
      - name: Core coverage target
        shell: bash -el {0}
        run: xvfb-run -a bash scripts/coverage.sh --minimum-core 85 --minimum-adapters 70
