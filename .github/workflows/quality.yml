name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environments/caddsuite.yml
          cache-environment: true
          init-shell: bash
      - name: Install headless rendering support
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Install package and dev dependencies
        shell: bash -el {0}
        run: python -m pip install --no-build-isolation -e ".[dev,chem,protonation,structure,analysis,visualization,reporting,volumetric]"
      - name: Static and repository checks
        shell: bash -el {0}
        run: xvfb-run -a bash scripts/check.sh
      - name: Core coverage target
        shell: bash -el {0}
        run: xvfb-run -a bash scripts/coverage.sh --minimum-core 85 --minimum-adapters 70

  web:
    name: Web build and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend package for browser fixture
        run: python -m pip install -e ".[chem]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright Chromium and system libraries
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run web API, type, production build, and browser checks
        run: bash scripts/check-web.sh
