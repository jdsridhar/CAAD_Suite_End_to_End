# Conda environment for the CADD Suite platform CORE (not the engines).
# Engines keep their own envs (cadd, gmx, gmxMMPBSA, dft-gui) — see ADR-0002.
#
#   conda env create -f environments/caddsuite.yml
#   conda activate caddsuite
#   pip install -e . --no-deps --no-build-isolation
#
# Lower bounds here are the *intent*; the exact resolved set is recorded in
# environments/caddsuite.lock.txt (conda list --explicit) — ADR-0012.
name: caddsuite
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  # --- core runtime ---
  - pydantic>=2.7,<3
  - sqlalchemy>=2.0,<2.1
  - alembic>=1.13
  - typer>=0.12
  - pyyaml>=6
  - defusedxml>=0.7.1,<1  # hardened parsing for external PLIP XML reports
  - numpy>=1.26
  - rdkit>=2025.03,<2026    # Dimorphite-DL 2.0.2 requires RDKit <2026; use the compatible 2025 series.
  - dimorphite-dl=2.0.2     # protonation adapter reference implementation, Phase 4.3
  - biopython>=1.83,<2      # mmCIF parsing and chain/entity structure extraction, Phase 4.4
  # --- build + quality tooling ---
  - hatchling>=1.25
  - pytest>=8
  - pytest-cov
  - hypothesis
  - ruff
  - mypy
  - types-pyyaml
  - import-linter
